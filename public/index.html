<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fitness Drive Gym</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #090d16;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .loader-card {
      padding: 24px;
      border-radius: 20px;
      background: #0f172a;
      border: 1px solid #1e293b;
    }
    .spinner {
      border: 3px solid rgba(0, 240, 255, 0.1);
      border-left-color: #00f0ff;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loader-card">
    <div class="spinner"></div>
    <h3 style="margin: 0; font-size: 18px; font-weight: 800; color: #00f0ff;">FITNESS DRIVE GYM</h3>
    <p style="margin: 8px 0 0; font-size: 12px; color: #94a3b8;">Connecting to Gym Arena...</p>
  </div>
</body>
</html>
